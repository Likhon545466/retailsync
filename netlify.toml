[build]
  publish = "."

[[redirects]]
  from = "/slides"
  to = "/slides.html"
  status = 200

[[redirects]]
  from = "/presentation"
  to = "/presentation_deck.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
